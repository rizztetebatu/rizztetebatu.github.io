<title>Rizz Tetebatu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one long scroll like a walk, from the village up to the volcano. Sticky bar with language and WhatsApp. */
:root{
  --bg:#F2F4EA; --surface:#FFFFFF; --ink:#132018; --muted:#56665A; --line:#D9E0CF;
  --paddy:#2F7A3B; --shoot:#C9E15C; --lava:#DE4F22; --lava-ink:#FFFFFF; --sky:#E4EDDC;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --ink:#E8EFE2; --muted:#9BAB9E; --line:#26362B;
  --paddy:#6FC07A; --shoot:#C9E15C; --lava:#FF6E3F; --lava-ink:#1A0E08; --sky:#132019; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --ink:#E8EFE2; --muted:#9BAB9E; --line:#26362B;
  --paddy:#6FC07A; --shoot:#C9E15C; --lava:#FF6E3F; --lava-ink:#1A0E08; --sky:#132019; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em}
h3{font-size:22px;font-weight:800}
p{margin:0}
.eyebrow{font:700 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--paddy)}
section{padding-block:72px}
:focus-visible{outline:3px solid var(--lava);outline-offset:3px;border-radius:6px}

/* wordmark */
.logo{display:inline-flex;flex-direction:column;line-height:.82;text-decoration:none;white-space:nowrap}
.logo .r{font:800 26px/.82 var(--display);letter-spacing:-.04em}
.logo .r i{font-style:normal;color:var(--lava)}
.logo .t{font:700 9.5px/1 var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--paddy);margin-top:3px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.langs{margin-left:auto;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.langs button{border:0;background:none;color:var(--muted);font:700 13px/1 var(--body);padding:7px 10px;border-radius:99px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--lava);color:var(--lava-ink);text-decoration:none;font:700 16px/1 var(--body);padding:15px 22px;border-radius:99px;border:0;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.small{padding:10px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.wa{width:18px;height:18px;flex:none}
@media (max-width:560px){.bar .btn .t{display:none}.bar .btn.small{padding:10px}}

/* hero */
.hero{padding-block:56px 0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:end}
.hero h1{font-size:clamp(44px,8.4vw,92px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--paddy);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--shoot) 70%,transparent) 62%)}
.hero .lede{font-size:clamp(18px,2.2vw,21px);color:var(--muted);max-width:36ch;margin-top:20px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.speaks{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{font:700 13px/1 var(--body);padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.scene{width:100%;max-width:100%;height:auto;display:block}
.alt{display:flex;justify-content:space-between;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:2px solid var(--ink);padding-top:10px;margin-top:8px;font-variant-numeric:tabular-nums}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.hero{padding-top:36px}}

/* promises */
.promises{padding-block:40px 0}
.promises ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.promises ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
.promises li{border-top:2px solid var(--ink);padding-top:12px;display:grid;gap:4px}
.promises b{font:800 18px/1.15 var(--display)}
.promises span{font-size:15px;color:var(--muted)}

/* tours */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:32px}
.head p{color:var(--muted);max-width:42ch}
.tours{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.tours{grid-template-columns:1fr}}
.tour{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;max-width:100%;background:var(--sky);display:grid;place-items:center;color:var(--muted);font:600 14px/1.3 var(--body);text-align:center;padding:16px;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tour .body{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{font:700 13px/1 var(--body);padding:7px 10px;border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.meta .price{background:var(--shoot);color:#132018}
.tour ul{margin:0;padding-left:18px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.facts dt{font-weight:700}
.facts dd{margin:0;color:var(--muted)}
.tour .note{font-size:14px;color:var(--muted);border-left:3px solid var(--lava);padding-left:10px}
.tour .btn{margin-top:auto;align-self:flex-start}
.more{margin-top:18px;border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px}
.more .list{display:flex;flex-wrap:wrap;gap:8px}

/* about */
.about{background:var(--ink);color:var(--bg)}
.about .eyebrow{color:var(--shoot)}
.about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:center}
@media (max-width:760px){.about-grid{grid-template-columns:1fr}}
.about .photo{aspect-ratio:4/5;border-radius:var(--r);background:color-mix(in srgb,var(--bg) 10%,var(--ink));color:color-mix(in srgb,var(--bg) 60%,var(--ink))}
.about .story{display:grid;gap:16px;font-size:19px;max-width:58ch}
.about .story p:first-of-type{font:800 clamp(26px,3.6vw,36px)/1.15 var(--display);letter-spacing:-.01em}
.plants{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.plants span{font:700 13px/1 var(--body);padding:8px 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--bg) 30%,var(--ink))}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:s}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:8px}
.step::before{counter-increment:s;content:counter(s);font:800 44px/1 var(--display);color:var(--paddy)}
.step p{color:var(--muted)}

/* reviews */
.reviews{background:var(--sky)}
.rev{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
@media (max-width:760px){.rev{grid-template-columns:1fr}}
.rev p{color:var(--muted);margin-top:12px;max-width:50ch}
.rev .ctas{display:flex;flex-wrap:wrap;gap:12px}

/* faq */
details{border-bottom:1px solid var(--line);padding-block:18px}
summary{font:800 20px/1.25 var(--display);cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--lava)}
details[open] summary::after{content:"×"}
details p{color:var(--muted);margin-top:10px;max-width:65ch}

footer{border-top:1px solid var(--line);padding-block:40px 110px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
footer a{text-decoration:none;font-weight:700;color:var(--ink)}
.float{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;box-shadow:0 8px 24px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.scene .sun{animation:rise 2.4s ease-out both}@keyframes rise{from{transform:translateY(30px)}to{transform:none}}}
</style>
</head>

<header class="bar">
  <div class="wrap">

  </div>
</header>

<main id="top">
  <section class="hero">

  <section class="about">
    <div class="wrap about-grid">
      <div class="photo" id="aboutPhoto" data-i18n="photo_rizz"></div>
      <div class="story">
        <p class="eyebrow" data-i18n="about_eyebrow"></p>
        <p data-i18n="about_1"></p>
        <p data-i18n="about_2"></p>
        <p data-i18n="about_3"></p>
        <div class="plants" id="plants"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="head"><div><p class="eyebrow" data-i18n="how_eyebrow"></p><h2 data-i18n="how_title"></h2></div></div>
      <div class="steps">
        <div class="step"><h3 data-i18n="s1_t"></h3><p data-i18n="s1_p"></p></div>
        <div class="step"><h3 data-i18n="s2_t"></h3><p data-i18n="s2_p"></p></div>
        <div class="step"><h3 data-i18n="s3_t"></h3><p data-i18n="s3_p"></p></div>
      </div>

  </section>

  <section class="reviews">

  <section>

      <div class="head"><div><p class="eyebrow">FAQ</p><h2 data-i18n="faq_title"></h2></div></div>
      <div id="faq"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div><span class="logo"><span class="r">rizz<i>.</i></span><span class="t">Tetebatu</span></span><p style="margin-top:12px" data-i18n="foot_where"></p></div>
    <div style="display:grid;gap:6px">
      <a class="js-wa" href="#" target="_blank" rel="noopener">WhatsApp <span id="waNum"></span></a>
      <a id="mailLink" href="#">Email</a>
      <a id="igLink" href="#" target="_blank" rel="noopener">Instagram</a>
      <a id="mapsLink" href="#" target="_blank" rel="noopener">Google Maps</a>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const waLink = text => "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text);
const waIcon = '<svg class="wa" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg>';

function pickLang(){
  try{ const s = localStorage.getItem("rizz-lang"); if (s && T[s]) return s; }catch(e){}
  const n = (navigator.language||"en").slice(0,2);
  return T[n] ? n : "en";
}
function render(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if (t[k]) el.textContent = t[k]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll(".js-wa").forEach(a => a.href = waLink(t.wa_general));
  document.getElementById("promises").innerHTML = t.promises.map(([b,s]) => "<li><b>" + esc(b) + "</b><span>" + esc(s) + "</span></li>").join("");

  document.getElementById("tourList").innerHTML = CONFIG.tours.map(tour => {
    const k = "tour_" + tour.id + "_";
    const hours = /^\d+$/.test(tour.hours) ? tour.hours + " " + t.hours : tour.hours;
    const price = tour.price ? esc(tour.price) : esc(t.ask_price);
    const photo = tour.photo ? '<img src="' + esc(tour.photo) + '" alt="' + esc(t[k+"t"]) + '">' : esc(t.photo);
    const note = t[k+"n"] ? '<p class="note">' + esc(t[k+"n"]) + '</p>' : "";
    const facts = [
      tour.start ? [t.l_start, tour.start] : null,
      [t.l_level, t.level[tour.level]],
      [t.l_incl, t[k+"inc"]],
      tour.id !== "rinjani" ? [t.l_bring, t.bring_walk] : null
    ].filter(Boolean).map(([a,b]) => "<dt>" + esc(a) + "</dt><dd>" + esc(b) + "</dd>").join("");
    return '<article class="tour"><div class="photo">' + photo + '</div><div class="body">' +
      '<div class="meta"><span>' + esc(hours) + '</span><span class="price">' + price + '</span></div>' +
      '<h3>' + esc(t[k+"t"]) + '</h3><p>' + esc(t[k+"p"]) + '</p>' +
      '<ul>' + t[k+"i"].map(i => '<li>' + esc(i) + '</li>').join("") + '</ul>' +
      '<dl class="facts">' + facts + '</dl>' + note +
      '<a class="btn" target="_blank" rel="noopener" href="' + waLink(t.wa_tour + t[k+"t"]) + '">' + waIcon + esc(t.book) + '</a></div></article>';
  }).join("");

  document.getElementById("moreList").innerHTML = t.more.map(m => '<span class="chip">' + esc(m) + '</span>').join("");
  document.getElementById("plants").innerHTML = t.plants.map(p => "<span>" + esc(p) + "</span>").join("");
  document.getElementById("faq").innerHTML = t.faq.map(([q,a]) => "<details><summary>" + esc(q) + "</summary><p>" + esc(a) + "</p></details>").join("");
  if (CONFIG.photos.about) document.getElementById("aboutPhoto").innerHTML = '<img src="' + esc(CONFIG.photos.about) + '" alt="Rizz">';
}
function setup(){
  const maps = CONFIG.googleMapsUrl || "https://www.google.com/maps/search/Rizz+Tetebatu";
  document.getElementById("waNum").textContent = "+" + CONFIG.whatsapp;
  document.getElementById("igLink").href = "https://instagram.com/" + CONFIG.instagram;
  document.getElementById("mailLink").href = "mailto:" + CONFIG.email;
  document.getElementById("mailLink").textContent = CONFIG.email;
  document.getElementById("mapsLink").href = maps;
  document.getElementById("revRead").href = maps;
  document.getElementById("revWrite").href = CONFIG.googleReviewUrl || maps;
  document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
    try{ localStorage.setItem("rizz-lang", b.dataset.lang); }catch(e){}
    render(b.dataset.lang);
  }));
  render(pickLang());
}
setup();
</script>
